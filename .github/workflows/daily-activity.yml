name: Krishiv Studios Daily Activity & Health

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  daily-org-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily organization status
        run: |
          mkdir -p .github
          echo "Krishiv Studios Daily Active Ping: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/daily-ping.txt

      - name: Commit and push daily activity
        run: |
          git config --global user.name "Krylo-60"
          git config --global user.email "71krishivpb@gmail.com"
          git add .github/daily-ping.txt
          git commit -m "chore(org): automated daily Krishiv Studios activity check [skip ci]" || echo "No changes to commit"
          git push origin main
