name: Krishiv Studios Active Health & Activity

on:
  schedule:
    # Runs automatically twice every hour (every 30 minutes)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  org-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update active organization ping
        run: |
          mkdir -p .github
          echo "Krishiv Studios Active Pulse: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/daily-ping.txt

      - name: Commit and push activity
        run: |
          git config --global user.name "Krylo-60"
          git config --global user.email "71krishivpb@gmail.com"
          git add .github/daily-ping.txt
          git commit -m "chore(pulse): automated repository activity sync [skip ci]" || echo "No changes to commit"
          git push origin main
